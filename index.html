<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Gare gruppo #chissà</title>
    <!-- Carica Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-6 shadow-md">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-3xl font-bold">Calendario Gare gruppo #chissà</h1>
            <p class="text-blue-100 mt-1">Trova tutte le partite filtrando per squadra, categoria e data</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto p-6">
        
        <!-- Sezione Filtri -->
        <div class="bg-white p-5 rounded-lg shadow-sm mb-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Campionato</label>
                <select id="filtroCampionato" class="w-full p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 bg-white">
                    <option value="">Tutti i campionati</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Girone</label>
                <select id="filtroGirone" class="w-full p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 bg-white">
                    <option value="">Tutti i gironi</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Data esatta</label>
                <input type="date" id="filtroData" class="w-full p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Cerca Squadra</label>
                <input type="text" id="filtroSquadra" placeholder="Es. ASD NFA, Ostia..." class="w-full p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500">
            </div>
            
        </div>

        <!-- Risultati: Lista Partite (Flex Column) -->
        <div id="listaPartite" class="flex flex-col gap-4">
            <!-- Le righe delle partite verranno iniettate qui da JavaScript -->
        </div>

        <!-- Messaggio nessun risultato -->
        <div id="nessunRisultato" class="hidden text-center py-10 text-gray-500">
            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p class="mt-4 text-lg">Nessuna partita trovata con i filtri selezionati.</p>
        </div>

    </main>

    <!-- Logica Applicativa -->
    <script>
        let partiteGlobali = [];

        // Inizializza l'app caricando i dati
        document.addEventListener('DOMContentLoaded', () => {
            fetch('partite.json')
                .then(response => {
                    if (!response.ok) throw new Error("Errore nel caricamento del file JSON");
                    return response.json();
                })
                .then(data => {
                    partiteGlobali = data;
                    
                    // Ordina le partite per data crescente
                    partiteGlobali.sort((a, b) => new Date(a.data) - new Date(b.data));
                    
                    popolaFiltriSelect(partiteGlobali);
                    renderPartite(partiteGlobali);
                })
                .catch(error => {
                    console.error("Impossibile caricare le partite:", error);
                    document.getElementById('listaPartite').innerHTML = `<div class="text-red-500 text-center p-4 bg-red-50 rounded">Errore nel caricamento dei dati. Assicurati che il file 'partite.json' esista.</div>`;
                });

            // Aggiungi event listener a tutti gli input dei filtri
            document.querySelectorAll('select, input').forEach(el => {
                el.addEventListener('input', applicaFiltri);
            });
        });

        // Estrae i valori univoci e popola i menu a tendina
        function popolaFiltriSelect(partite) {
            const campionati = [...new Set(partite.map(p => p.campionato))].sort();
            const gironi = [...new Set(partite.map(p => p.girone))].sort();

            const selectCampionato = document.getElementById('filtroCampionato');
            const selectGirone = document.getElementById('filtroGirone');

            campionati.forEach(camp => {
                let option = document.createElement('option');
                option.value = camp;
                option.textContent = camp;
                selectCampionato.appendChild(option);
            });

            gironi.forEach(gir => {
                let option = document.createElement('option');
                option.value = gir;
                option.textContent = gir;
                selectGirone.appendChild(option);
            });
        }

        // Logica di filtraggio
        function applicaFiltri() {
            const fCampionato = document.getElementById('filtroCampionato').value;
            const fGirone = document.getElementById('filtroGirone').value;
            const fData = document.getElementById('filtroData').value;
            const fSquadra = document.getElementById('filtroSquadra').value.toLowerCase().trim();

            const filtrate = partiteGlobali.filter(p => {
                const matchCampionato = fCampionato === "" || p.campionato === fCampionato;
                const matchGirone = fGirone === "" || p.girone === fGirone;
                
                const matchSquadra = fSquadra === "" || 
                    p.squadra_casa.toLowerCase().includes(fSquadra) || 
                    p.squadra_trasferta.toLowerCase().includes(fSquadra);
                
                let matchData = true;
                if (fData !== "") {
                    const dataPartita = new Date(p.data).setHours(0,0,0,0);
                    const dataFiltro = new Date(fData).setHours(0,0,0,0);
                    matchData = dataPartita === dataFiltro;
                }

                return matchCampionato && matchGirone && matchSquadra && matchData;
            });

            renderPartite(filtrate);
        }

        // Genera l'HTML per le righe delle partite
        function renderPartite(partite) {
            const container = document.getElementById('listaPartite');
            const messaggioVuoto = document.getElementById('nessunRisultato');
            
            container.innerHTML = "";

            if (partite.length === 0) {
                messaggioVuoto.classList.remove('hidden');
                return;
            } else {
                messaggioVuoto.classList.add('hidden');
            }

            partite.forEach(p => {
                const dataObj = new Date(p.data);
                const dataFormattata = dataObj.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
                const oraFormattata = dataObj.toLocaleTimeString('it-IT', { hour: '2-digit', minute:'2-digit' });

                const cardHTML = `
                    <div class="bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition-shadow p-4 flex flex-col lg:flex-row lg:items-center justify-between border-l-4 border-l-blue-500 gap-4">
                        
                        <!-- Blocco Sinistra: Data e Ora -->
                        <div class="w-full lg:w-1/4 flex flex-col">
                            <div class="text-sm font-semibold text-gray-600 capitalize flex items-center mb-1">
                                <svg class="w-4 h-4 mr-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                ${dataFormattata}
                            </div>
                            <div class="font-bold text-blue-600 text-lg">${oraFormattata}</div>
                            <div class="text-xs font-mono text-gray-400 mt-1">Gara #${p.gara}</div>
                        </div>

                        <!-- Blocco Centro: Squadre (Affiancate orizzontalmente) -->
                        <div class="w-full lg:w-2/4 flex flex-row items-center justify-center text-center border-t border-b lg:border-t-0 lg:border-b-0 border-gray-100 py-4 lg:py-0">
                            <div class="text-lg font-bold text-gray-800 w-2/5 truncate text-right px-2" title="${p.squadra_casa}">${p.squadra_casa}</div>
                            <div class="text-xs font-bold text-gray-400 w-1/5 bg-gray-50 py-1 rounded-full">VS</div>
                            <div class="text-lg font-bold text-gray-800 w-2/5 truncate text-left px-2" title="${p.squadra_trasferta}">${p.squadra_trasferta}</div>
                        </div>

                        <!-- Blocco Destra: Campionato e Impianto -->
                        <div class="w-full lg:w-1/4 flex flex-col lg:items-end text-left lg:text-right mt-2 lg:mt-0">
                            <div class="mb-2">
                                <span class="inline-block px-2 py-1 bg-blue-100 text-blue-800 text-xs font-semibold rounded uppercase tracking-wide">${p.campionato}</span>
                                <span class="inline-block px-2 py-1 bg-gray-100 text-gray-600 text-xs font-semibold rounded uppercase tracking-wide mt-1 xl:mt-0 ml-0 xl:ml-1">${p.girone}</span>
                            </div>
                            <div class="text-sm text-gray-600 flex items-start lg:justify-end mt-1">
                                <svg class="w-4 h-4 mr-1 mt-0.5 flex-shrink-0 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                <span class="line-clamp-2">${p.impianto}</span>
                            </div>
                        </div>
                        
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }
    </script>
</body>
</html>
